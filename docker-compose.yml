version: "3.9"

# Local Postgres for running the real production migration & backend against
# it (this environment didn't have Docker available to run this itself —
# see README for the workaround used to verify things without it).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: metaweave
      POSTGRES_PASSWORD: metaweave
      POSTGRES_DB: metaweave
    ports:
      - "5432:5432"
    volumes:
      - metaweave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaweave"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://metaweave:metaweave@postgres:5432/metaweave
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  metaweave_pgdata:
